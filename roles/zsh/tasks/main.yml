---
- name: Install Zsh
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ distro_family }}.yml"
      paths:
        - distro
  tags: [zsh]

- name: Install Oh My Zsh
  ansible.builtin.include_tasks: oh_my_zsh.yml
  tags: [zsh, oh-my-zsh]
