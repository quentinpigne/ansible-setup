---
# `creates` remplace le couple stat + changed_when: true, qui rapportait
# systematiquement "changed". --unattended / RUNZSH / CHSH evitent que le
# script tente de lancer un shell interactif ou de faire un chsh.
- name: Install Oh My Zsh
  ansible.builtin.shell:
    cmd: >-
      sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      -- --unattended --keep-zshrc
    creates: "{{ user_home }}/.oh-my-zsh"
  environment:
    RUNZSH: "no"
    CHSH: "no"
    KEEP_ZSHRC: "yes"
  tags: [zsh, oh-my-zsh]
