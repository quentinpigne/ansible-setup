---
- name: Create CNI installation directory
  become: true
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
  tags: cni

- name: Download and install CNI
  become: true
  ansible.builtin.unarchive:
    src: https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz
    dest: /opt/cni/bin
    remote_src: yes
  tags: cni
