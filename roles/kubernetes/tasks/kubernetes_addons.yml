---
- name: Deploy Flannel
  become: true
  kubernetes.core.k8s:
    state: present
    src: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  tags: flannel

- name: Download Metric Server deployment file
  become: true
  ansible.builtin.get_url:
    url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
    dest: /home/{{ username }}
  tags: metric-server

- name: Add TLS insecure option to Metric Server deployment file
  become: true
  ansible.builtin.lineinfile:
    path: /home/{{ username }}/components.yaml
    insertafter: "--secure-port=10250$"
    line: "        - --kubelet-insecure-tls"
    firstmatch: yes
    state: present
  tags: metric-server

- name: Deploy Metric Server
  become: true
  kubernetes.core.k8s:
    state: present
    src: /home/{{ username }}/components.yaml
  tags: metric-server

- name: Remove Metric Server deployment file
  become: true
  ansible.builtin.file:
    path: /home/{{ username }}/components.yaml
    state: absent
  tags: metric-server

# Traefik remplace ingress-nginx, arrete depuis mars 2026. Il s'installe par
# son chart Helm, la methode officielle : il n'existe pas de manifeste
# unique comme pour ingress-nginx.
- name: Install Helm
  become: true
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: yes
    include: [linux-amd64/helm]
    extra_opts: [--strip-components=1]
    mode: "0755"
  tags: traefik

# Service en NodePort : HAProxy relaie le port 80 de l'hote vers lui, comme il
# le faisait pour ingress-nginx. L'IngressClass `traefik` est celle par
# defaut, les Ingress sans classe explicite lui reviennent.
- name: Deploy Traefik ingress controller
  become: true
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik
    chart_repo_url: https://traefik.github.io/charts
    chart_version: "{{ traefik_chart_version }}"
    release_namespace: traefik
    create_namespace: true
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    values:
      service:
        spec:
          type: NodePort
      ingressClass:
        enabled: true
        isDefaultClass: true
  tags: traefik
