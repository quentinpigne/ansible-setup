---
# HAProxy vient des depots Ubuntu : le PPA vbernat ne publie pas pour toutes
# les versions (rien pour la 26.04).
- name: Install HAProxy
  become: true
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: yes
  tags: haproxy

- name: Get Traefik ingress controller NodePort
  ansible.builtin.shell: kubectl get svc -n traefik traefik -o=jsonpath='{.spec.ports[?(@.port==80)].nodePort}'
  register: result
  tags: haproxy

- name: Insert configuration block to HAProxy configuration file
  become: true
  ansible.builtin.blockinfile:
    path: /etc/haproxy/haproxy.cfg
    append_newline: true
    prepend_newline: true
    block: |
      frontend Local_Server_80
        bind *:80
        mode http
        default_backend web-server-ingress_80

      backend web-server-ingress_80
        mode http
        balance roundrobin
        server ingress1 localhost:{{ result.stdout }}
  tags: haproxy

- name: Restart HAProxy service
  become: true
  ansible.builtin.systemd_service:
    name: haproxy
    state: restarted
  tags: haproxy
