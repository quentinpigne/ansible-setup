---
# Les images Ubuntu recentes du Microsoft Store activent deja
# `[boot] systemd=true`, donc ce test passe sans configuration sur WSL.
# Il n'est la que pour les cas limites (image ancienne, distro importee a la
# main, systemd desactive) ou le daemon docker ne survivrait pas a la session.
- name: Ensure systemd is the service manager
  ansible.builtin.assert:
    that: ansible_facts.service_mgr == 'systemd'
    fail_msg: >-
      systemd n'est pas PID 1 sur cet hote (service_mgr =
      {{ ansible_facts.service_mgr }}). Le daemon Docker ne sera pas gerable.
      Sur WSL : ajouter `[boot]` / `systemd=true` dans /etc/wsl.conf, puis
      `wsl --shutdown` depuis Windows.
  tags: [docker]

# python3-debian est requis par le module deb822_repository.
- name: Make sure ca-certificates, curl and python3-debian are installed
  become: true
  ansible.builtin.apt:
    pkg:
    - ca-certificates
    - curl
    - python3-debian
    update_cache: yes
  tags: docker

# apt-key n'existe plus depuis Ubuntu 26.04 : le depot est declare au format
# deb822, avec sa cle en Signed-By, comme le recommande la doc Docker.
# L'ancien docker.list doit disparaitre : deux sources Docker aux Signed-By
# differents feraient echouer apt.
- name: Remove the legacy Docker repository and key
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/trusted.gpg.d/docker.gpg
  tags: docker

- name: Adding Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    state: present
  tags: docker

- name: Installing Docker packages
  become: true
  ansible.builtin.apt:
    pkg:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    update_cache: yes
  tags: docker

- name: Check Docker is active
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  tags: docker

- name: Ensure group "docker" exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  tags: docker

- name: Adding user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: yes
  tags: docker
