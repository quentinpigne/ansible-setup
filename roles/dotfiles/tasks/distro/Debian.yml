---
# chezmoi n'existe dans aucun depot Debian/Ubuntu : fallback sur l'installeur
# officiel, comme pour les autres outils absents des depots.
- name: Create the local binaries directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    mode: "0755"
  tags: [dotfiles]

- name: Install chezmoi from the official installer
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ user_home }}/.local/bin"
    creates: "{{ user_home }}/.local/bin/chezmoi"
  tags: [dotfiles]

- name: Locate the chezmoi binary
  ansible.builtin.set_fact:
    chezmoi_bin: "{{ user_home }}/.local/bin/chezmoi"
  tags: [dotfiles]
