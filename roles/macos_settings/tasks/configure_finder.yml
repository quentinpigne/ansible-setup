---
- name: Finder - Configure defaults
  community.general.osx_defaults:
    domain: com.apple.finder
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ finder.defaults }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Kill Finder
  tags: [finder, defaults]

# Ni `become` ni `~` ici : sous become, `~` designe le home de root, et la
# tache demasquait /var/root/Library au lieu du dossier de l'utilisateur.
- name: Finder - Check the hidden flag of the folders
  ansible.builtin.command: "stat -f %Sf {{ item }}"
  loop: "{{ finder.show_folders | map('regex_replace', '^~', user_home) | list }}"
  register: finder_flags
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [finder, folders]

- name: Finder - Show the folders
  ansible.builtin.command: "chflags nohidden {{ item.item }}"
  loop: "{{ finder_flags.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.rc | default(1) == 0
    - "'hidden' in item.stdout | default('')"
  notify: Kill Finder
  tags: [finder, folders]

- name: Finder - Remove the default tags
  ansible.builtin.shell: |
    /usr/libexec/PlistBuddy -c "Delete :FavoriteTagNames" {{ finder_plist }}
    /usr/libexec/PlistBuddy -c "Add :FavoriteTagNames array" {{ finder_plist }}
    /usr/libexec/PlistBuddy -c "Add :FavoriteTagNames:0 string" {{ finder_plist }}
  vars:
    finder_plist: "{{ user_home }}/Library/Preferences/com.apple.finder.plist"
  when: finder.remove_tags
  changed_when: true
  notify: Kill Finder
  tags: [finder, tags]
