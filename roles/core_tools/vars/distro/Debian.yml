---
# Attention aux binaires renommes par Debian/Ubuntu :
#   bat      -> /usr/bin/batcat
#   fd-find  -> /usr/bin/fdfind
# Les alias correspondants doivent exister dans la branche Linux des dotfiles.
core_tools_package_names:
  age: age
  ansible: ansible
  bat: bat
  eza: eza
  fd: fd-find
  fzf: fzf
  git: git
  git-lfs: git-lfs
  htop: htop
  jq: jq
  mc: mc
  neovim: neovim
  rbw: rbw
  ripgrep: ripgrep
  tree: tree

# Depots necessaires avant installation, au format deb822_repository.
#
# Le PPA neovim unstable publie un build quotidien de la branche de
# developpement : les depots Ubuntu sont trop en retard (0.11 en 26.04) pour
# la config nvim, qui vise 0.12. Il est declare en deb822 avec sa cle en
# Signed-By : l'ajout par apt_repository echoue sans apt-key (Ubuntu 26.04),
# sur "Unable to get required signing key".
core_tools_repositories: >-
  {{ [{
       'name': 'neovim-ppa-unstable',
       'uris': 'https://ppa.launchpadcontent.net/neovim-ppa/unstable/ubuntu',
       'suites': ansible_facts.distribution_release,
       'components': 'main',
       'signed_by': 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x9DBB0BE9366964F134855E2255F96FCF8231B6DD',
     }] if ansible_facts.distribution == 'Ubuntu' else [] }}

# Fichiers poses par l'ancien ajout du PPA via apt_repository. Ils doivent
# disparaitre : deux sources aux Signed-By differents feraient echouer apt.
core_tools_legacy_sources:
  - neovim-ppa-ubuntu-unstable-*.list
  - neovim-ppa-ubuntu-unstable-*.sources

# Outils maintenus a la derniere version disponible a chaque execution, et pas
# seulement installes s'ils manquent.
core_tools_latest:
  - neovim

# Outils absents des depots de certaines distributions, installes alors depuis
# la release upstream (binaires dans /usr/local/bin). La disponibilite est
# testee a l'execution (`apt-cache show`), pas deduite d'une version de distro.
#
# rbw n'est package qu'a partir d'Ubuntu 25.04 : absent d'Ubuntu 24.04 et de
# Debian trixie. Upstream ne publie qu'une archive amd64. Le paquet APT tire
# pinentry-curses, ajoute ici a la main.
core_tools_rbw_version: "1.15.0"
core_tools_from_release:
  rbw:
    url: "https://github.com/doy/rbw/releases/download/{{ core_tools_rbw_version }}/rbw_{{ core_tools_rbw_version }}_linux_amd64.tar.gz"
    version: "{{ core_tools_rbw_version }}"
    binaries: [rbw, rbw-agent]
    dependencies: [pinentry-curses]
