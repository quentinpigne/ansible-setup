---
# Attention aux binaires renommes par Debian/Ubuntu :
#   bat      -> /usr/bin/batcat
#   fd-find  -> /usr/bin/fdfind
# Les alias correspondants doivent exister dans la branche Linux des dotfiles.
core_tools_package_names:
  ansible: ansible
  bat: bat
  eza: eza
  fd: fd-find
  fzf: fzf
  git: git
  git-lfs: git-lfs
  htop: htop
  jq: jq
  mc: mc
  neovim: neovim
  ripgrep: ripgrep
  tree: tree

# Depots necessaires avant installation.
# Le PPA neovim compense un neovim trop ancien dans les depots Ubuntu. A
# partir de la 26.04, la version des depots suffit, et le PPA echoue sur
# "Unable to get required signing key" : il n'est plus ajoute.
core_tools_repositories: >-
  {{ ['ppa:neovim-ppa/unstable']
     if ansible_facts.distribution == 'Ubuntu'
        and ansible_facts.distribution_version is version('26.04', '<')
     else [] }}
