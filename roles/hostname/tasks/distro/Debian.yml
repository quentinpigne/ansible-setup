---
- name: Set the system hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ hostname }}"
  tags: [hostname]

- name: Ensure the hostname resolves in /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ hostname }}"
    state: present
  tags: [hostname]
