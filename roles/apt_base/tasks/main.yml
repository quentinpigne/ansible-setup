---
# Meme principe que le role homebrew : `apt` porte le socle commun
# (group_vars/linux.yml), `apt_context` ce qui depend du contexte
# (group_vars/linux_perso.yml, linux_pro.yml). Les listes sont concatenees,
# Ansible ne fusionnant pas les dictionnaires de group_vars.
- name: Add the APT PPA repositories
  become: true
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
  loop: >-
    {{ apt_base_ppa
       + (apt.ppa | default([]))
       + (apt_context.ppa | default([])) }}
  tags: [apt, ppa]

- name: Install the base APT packages
  become: true
  ansible.builtin.apt:
    name: >-
      {{ apt_base_packages
         + (apt.packages | default([]))
         + (apt_context.packages | default([])) }}
    state: present
    cache_valid_time: 3600
  tags: [apt, packages]

# Non joue par defaut : `--tags upgrade`
- name: Upgrade all APT packages
  become: true
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
  tags: [never, upgrade]
