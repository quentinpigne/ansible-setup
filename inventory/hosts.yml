---
# Trois axes independants, materialises par des groupes Ansible.
# Chaque machine appartient a un groupe de chaque axe :
#
#   machine       contexte   profil    OS
#   ------------  ---------  --------  ------
#   mac-perso     perso      desktop   mac
#   ubuntu01      perso      server    linux
#   wsl-kaizen    pro        wsl       linux
#   linux-perso   perso      desktop   linux    (a venir)
all:
  children:

    ## Axe 1 -- contexte
    perso:
      hosts:
        mac-perso:
        ubuntu01:
    pro:
      hosts:
        wsl-kaizen:

    ## Axe 2 -- profil
    desktop:
      hosts:
        mac-perso:
    server:
      hosts:
        ubuntu01:
    wsl:
      hosts:
        wsl-kaizen:

    ## Axe 3 -- OS
    mac:
      hosts:
        mac-perso:
          ansible_connection: local
    linux:
      hosts:
        ubuntu01:
        # WSL se joue en local, depuis l'interieur de la distro.
        wsl-kaizen:
          ansible_connection: local
