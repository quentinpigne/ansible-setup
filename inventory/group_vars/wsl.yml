---
profile: wsl

##
# WSL
#
# systemd n'est pas gere ici : les images Ubuntu recentes du Store livrent
# deja `[boot] systemd=true`. Les roles qui en dependent (docker) le verifient
# via un assert plutot que de reecrire wsl.conf.
#
# Attention : toute modification de /etc/wsl.conf ne prend effet qu'apres un
# `wsl --shutdown` lance depuis Windows.
##
wsl:
  # Pas de gestion du hostname : sur WSL il est herite de Windows.
  generate_resolv_conf: true
